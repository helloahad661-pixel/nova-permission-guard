# ─────────────────────────────────────────────────────────
# AUTO — unattended, no prompt, but ONLY because code path hard-locks privacy to private
# ─────────────────────────────────────────────────────────
# This tier is BELOW green in privilege but is checked first. It exists for exactly one
# action: auto_upload_youtube_video. The function itself hard-codes privacy_status="private"
# and ignores any caller-supplied value, so even if the LLM hallucinates "public", the code
# cannot publish. Public/unlisted always require YELLOW + explicit user confirmation via
# upload_youtube_video. See core/tool_registry.py:auto_upload_youtube_video and
# core/youtube_watcher.py for Daily Cap / Dead-letter / Token Health.
auto:
  paths:
    - "~/Nova/assets/kids/output"
    - "~/nova/assets/kids/output"
  apps: []
  hardware: []
  actions:
    - "auto_upload_youtube_video"

# ─────────────────────────────────────────────────────────
# YELLOW — modifies state, recoverable, requires confirmation
# ─────────────────────────────────────────────────────────
