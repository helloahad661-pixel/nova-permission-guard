    - "next_track"
    - "previous_track"
    - "set_brightness"
    - "lock_screen"
    - "sleep_system"
    - "train_model"
    - "create_soup_config"
    - "check_gpu_status"
    - "upload_youtube_video"

# ─────────────────────────────────────────────────────────
# RED — hard/impossible to reverse, ALWAYS requires confirmation
# ─────────────────────────────────────────────────────────
red:
  paths:
    - "~/Downloads"
    - "~/Documents"
    - "~/Desktop"
  apps: []
  hardware:
    - "camera"
    - "microphone"
  actions:
    - "delete_files"
    - "empty_trash"
    - "kill_process"
    - "download"   # downloading arbitrary files from the web
    - "delete_file"
    - "shutdown_system"
    - "restart_system"

# ─────────────────────────────────────────────────────────
# BLACK — reserved, disabled by default. Do not populate unless
# you fully understand the risk. Requires manual code override
# in capability_engine.py to ever be reachable.
# ─────────────────────────────────────────────────────────
black:
  paths: []
  apps: []
  hardware: []
  actions: []

