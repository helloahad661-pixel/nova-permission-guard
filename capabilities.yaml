# ============================================================
# Nova Capability Manifest
# ============================================================
# This file defines EXACTLY what Nova is allowed to do.
# Edit this file directly to restrict or expand permissions.
# The `denied` section is ABSOLUTE — it overrides every clearance level.
#
# Clearance levels (from your existing gateway):
#   GREEN  = safe, read-only or reversible actions
#   YELLOW = actions that modify state but are recoverable
#   RED    = actions that are hard/impossible to reverse
#   BLACK  = reserved, should require explicit manual override (not used by default)
# ============================================================

version: "1.0"

# ─────────────────────────────────────────────────────────
# ABSOLUTE DENYLIST — overrides ALL clearance levels, no exceptions
# ─────────────────────────────────────────────────────────
denied:
  paths:
    - "/System"
    - "/Library/Keychains"
    - "/private/var/db"
    - "~/.ssh"
    - "~/.aws"
    - "~/.gnupg"
    - "/etc"
  apps:
    - "Terminal"          # prevent Nova from controlling Terminal via AppleScript (could self-modify)
    - "Keychain Access"
    - "System Settings"
    - "System Preferences"
  actions:
    - "format_disk"
    - "disable_firewall"
    - "disable_filevault"
    - "modify_sudoers"
    - "delete_system_files"
    - "kill_process:kernel_task"
    - "kill_process:WindowServer"

# ─────────────────────────────────────────────────────────
# GREEN — safe, reversible, no confirmation needed
# ─────────────────────────────────────────────────────────
